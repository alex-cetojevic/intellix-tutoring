<script>
// Language choice. An Italian browser landing on an English page is sent to the Italian
// version once; after that the EN | IT switch is respected. It runs first in <head>,
// so the English page does not load before the jump.
(function () {
  try {
    if (document.documentElement.lang === 'it') {
      localStorage.setItem('langChosen', 'it');
      return;
    }
    var itUrl = {{ page.hreflang_it | jsonify }};
    if (!itUrl || localStorage.getItem('langChosen')) return;
    if (navigator.language && navigator.language.startsWith('it')) {
      localStorage.setItem('langChosen', 'it');
      location.replace(itUrl + location.search + location.hash);
    } else {
      localStorage.setItem('langChosen', 'en');
    }
  } catch (e) { /* storage blocked: stay on this page */ }
})();
</script>
<!-- Google tag (gtag.js). The script loads only after the page has loaded and painted,
     so it never delays the first screen. Events sent before then wait in dataLayer. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-7RMPQWV1JF');

  window.addEventListener('load', function () {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-7RMPQWV1JF';
        document.head.appendChild(s);
      });
    });
  });
</script>
<meta charset="UTF-8" />
<title>{{ page.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="{{ page.description }}" />
{%- if page.robots %}
<meta name="robots" content="{{ page.robots }}" />
{%- endif %}
{%- if page.canonical %}
<link rel="canonical" href="{{ page.canonical }}" />
{%- endif %}
{%- unless page.no_twitter %}
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.twitter_title | default: page.title }}" />
<meta name="twitter:description" content="{{ page.description }}" />
<meta name="twitter:image" content="https://intellixtutoring.com/alex-800.jpg" />
{%- endunless %}
<meta property="og:title" content="{{ page.og_title | default: page.title }}" />
<meta property="og:description" content="{{ page.og_description | default: page.description }}" />
<meta property="og:type" content="{{ page.og_type }}" />
<meta property="og:url" content="{{ page.og_url | default: page.canonical }}" />
<meta property="og:site_name" content="Intellix Tutoring" />
<meta property="og:image" content="https://intellixtutoring.com/alex-800.jpg" />
<meta property="og:locale" content="{{ page.locale }}" />
{%- if page.hreflang_en %}
<link rel="alternate" hreflang="en" href="{{ page.hreflang_en }}" />
<link rel="alternate" hreflang="it" href="{{ page.hreflang_it }}" />
<link rel="alternate" hreflang="x-default" href="{{ page.hreflang_en }}" />
{%- endif %}
{%- if page.preload %}
{{ page.preload }}
{%- endif %}
<!-- Self-hosted fonts (@font-face in styles.css). Preloading the two main files means
     they're usually ready at first paint, so text doesn't reflow when they swap in. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/libre-franklin-latin-wght-normal.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="/fonts/libre-caslon-text-latin-400-normal.woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
<script src="/main.js" defer></script>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
