<!-- No automatic language redirect: visitors stay on the page they opened and use the
     EN | IT switch in the header (Google advises against redirecting by browser language). -->
<!-- Google tag (gtag.js), only with consent. Nothing is loaded and no cookie is set until the
     visitor presses Accept in the banner (footer.html, main.js). The choice is kept in
     localStorage as analyticsConsent. With consent, the script still loads only after the
     page has loaded and painted, so it never delays the first screen. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  window.analytics = {
    loaded: false,
    allowed: function () {
      try { return localStorage.getItem('analyticsConsent') === 'yes'; } catch (e) { return false; }
    },
    load: function () {
      if (this.loaded) return;
      this.loaded = true;
      // Statistics only: the advertising signals stay off.
      gtag('consent', 'default', { analytics_storage: 'granted', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      gtag('js', new Date());
      gtag('config', 'G-7RMPQWV1JF');
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-7RMPQWV1JF';
      document.head.appendChild(s);
    }
  };
  if (window.analytics.allowed()) {
    window.addEventListener('load', function () {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { window.analytics.load(); });
      });
    });
  }
</script>
<meta charset="UTF-8" />
<title>{{ page.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="{{ page.description }}" />
<meta name="p:domain_verify" content="60fdd81b48a4ed5210ac964160591cdd" />
{%- if page.robots %}
<meta name="robots" content="{{ page.robots }}" />
{%- endif %}
{%- if page.canonical %}
<link rel="canonical" href="{{ page.canonical }}" />
{%- endif %}
{%- unless page.no_twitter %}
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.twitter_title | default: page.title }}" />
<meta name="twitter:description" content="{{ page.description }}" />
<meta name="twitter:image" content="https://intellixtutoring.com/share-{% if page.locale == 'it_IT' %}it{% else %}en{% endif %}.jpg" />
{%- endunless %}
<meta property="og:title" content="{{ page.og_title | default: page.title }}" />
<meta property="og:description" content="{{ page.og_description | default: page.description }}" />
<meta property="og:type" content="{{ page.og_type }}" />
<meta property="og:url" content="{{ page.og_url | default: page.canonical }}" />
<meta property="og:site_name" content="Intellix Tutoring" />
<!-- 1200×630 share card, one per language (made from alex-1200.jpg). -->
<meta property="og:image" content="https://intellixtutoring.com/share-{% if page.locale == 'it_IT' %}it{% else %}en{% endif %}.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{% if page.locale == 'it_IT' %}Alex Ćetojević, tutor di Matematica e Fisica IB{% else %}Alex Ćetojević, IB Maths and Physics tutor{% endif %}" />
<meta property="og:locale" content="{{ page.locale }}" />
{%- if page.hreflang_en %}
<link rel="alternate" hreflang="en" href="{{ page.hreflang_en }}" />
<link rel="alternate" hreflang="it" href="{{ page.hreflang_it }}" />
<link rel="alternate" hreflang="x-default" href="{{ page.hreflang_en }}" />
{%- endif %}
{%- if page.preload %}
{{ page.preload }}
{%- endif %}
<!-- Self-hosted fonts (@font-face in styles.css). Preloading the two main files means
     they're usually ready at first paint, so text doesn't reflow when they swap in. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/libre-franklin-latin-wght-normal.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="/fonts/libre-caslon-text-latin-400-normal.woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
<script src="/main.js" defer></script>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
